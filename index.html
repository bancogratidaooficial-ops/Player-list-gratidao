<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>V86 PLAY LIST</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#FFD700">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}
body{background:#000;color:#fff;text-align:center;padding:10px}
.player{border:2px solid #FFD700;border-radius:20px;padding:15px;background:#111;margin-bottom:15px}
audio{width:100%;margin:10px 0}
#nome{color:#FFD700;font-size:20px;font-weight:bold;margin:10px 0;min-height:25px}
.btns{display:flex;justify-content:center;gap:10px;margin:10px 0;flex-wrap:wrap}
.btns button{background:#FFD700;border:none;width:70px;height:70px;border-radius:50%;font-size:25px;cursor:pointer;font-weight:bold}
.btns button.small{width:60px;height:60px;background:#222;border:2px solid #555}
.lista{text-align:left;background:#1a1a1a;border-radius:10px;padding:10px;max-height:300px;overflow:auto;margin:10px 0}
.item{padding:10px;border-bottom:1px solid #333;cursor:pointer}
.item.active{color:#FFD700;background:#222}
.green{background:#00d26a;color:#fff;border:none;padding:15px;border-radius:12px;width:100%;font-weight:bold;font-size:16px;margin:10px 0;cursor:pointer}
.yellow-box{background:#FFD700;color:#000;border-radius:15px;padding:15px;margin:15px 0}
.yellow-box button{width:100%;padding:12px;margin:6px 0;border-radius:10px;border:none;font-weight:bold;font-size:15px;cursor:pointer}
.black{background:#000;color:#FFD700}
</style>
</head>
<body>

<div class="player">
<audio id="audio" controls></audio>
<div id="nome">Carregando músicas...</div>
<div id="contador" style="color:#aaa">0 músicas</div>
<div class="btns">
<button class="small" onclick="aleatorio()">🔀</button>
<button onclick="anterior()">⏮</button>
<button style="width:80px;height:80px;font-size:30px" onclick="playPause()">▶️</button>
<button onclick="proxima()">⏭</button>
<button class="small" onclick="repetir()">🔁</button>
</div>
<div class="lista" id="lista"></div>
</div>

<button class="green" onclick="document.getElementById('fileInput').click()">➕ Adicionar Músicas e Vídeos do Celular</button>
<input type="file" id="fileInput" multiple accept="audio/*,video/*" style="display:none">

<div class="yellow-box">
<h2>Gostou do V86 PLAY? 🔥</h2>
<p>Compartilhe com a família e escutem juntos!</p>
<button class="black" onclick="tocarAleatorio()">🔀 Tocar Músicas Aleatoriamente</button>
<button class="green" onclick="compartilharZap()">💚 Compartilhar no WhatsApp</button>
<button class="black" onclick="convidar()">👥 Convidar Amigo / Esposa</button>
<p style="margin-top:10px"><a href="privacidade.html" style="color:#000">🔒 Política de Privacidade</a></p>
</div>

<button class="green" style="background:#FFD700;color:#000" onclick="instalar()">📲 INSTALAR APP NO CELULAR</button>

<script>
let musicas = [];
let indice = 0;
const audio = document.getElementById('audio');
const nomeEl = document.getElementById('nome');
const listaEl = document.getElementById('lista');
const contadorEl = document.getElementById('contador');
let deferredPrompt = null;

// CARREGA AUTOMATICO DO GITHUB
async function carregarListaGitHub(){
  try{
    const res = await fetch('./musicas/lista.json?v='+Date.now());
    const lista = await res.json();
    musicas = lista.map(m => ({
      nome: m.nome,
      url: './musicas/' + m.arquivo
    }));
    if(musicas.length>0){
      renderizar();
      carregar(0);
    }else{
      nomeEl.innerText = "Nenhuma música na lista.json";
    }
  }catch(e){
    nomeEl.innerText = "Adicione músicas pelo botão verde";
    console.log("Erro lista.json", e);
  }
}

function renderizar(){
  listaEl.innerHTML = "";
  contadorEl.innerText = musicas.length + " músicas/vídeos";
  musicas.forEach((m,i)=>{
    const div = document.createElement('div');
    div.className = 'item' + (i===indice? ' active' : '');
    div.innerText = (i+1)+'. '+m.nome;
    div.onclick = ()=>{carregar(i); audio.play();};
    listaEl.appendChild(div);
  });
}

function carregar(i){
  indice = i;
  audio.src = musicas[i].url;
  nomeEl.innerText = musicas[i].nome;
  renderizar();
}

function playPause(){
  if(audio.paused){audio.play();}else{audio.pause();}
}

function proxima(){if(musicas.length){carregar((indice+1)%musicas.length); audio.play();}}
function anterior(){if(musicas.length){carregar((indice-1+musicas.length)%musicas.length); audio.play();}}
function aleatorio(){if(musicas.length){carregar(Math.floor(Math.random()*musicas.length)); audio.play();}}
function tocarAleatorio(){aleatorio();}
function repetir(){audio.loop =!audio.loop; alert(audio.loop? "Repetir: LIGADO" : "Repetir: DESLIGADO");}

audio.onended = ()=>{proxima();};

// Adicionar do celular
document.getElementById('fileInput').addEventListener('change', e=>{
  const files = Array.from(e.target.files);
  files.forEach(f=>{
    musicas.push({nome: f.name, url: URL.createObjectURL(f)});
  });
  renderizar();
  if(musicas.length===files.length) carregar(0);
});

// Compartilhar
function compartilharZap(){
  const url = window.location.href;
  window.open(`https://wa.me/?text=Escuta minha playlist no V86 PLAY! ${url}`, '_blank');
}
function convidar(){compartilharZap();}

// Instalar PWA
window.addEventListener('beforeinstallprompt', e=>{e.preventDefault(); deferredPrompt=e;});
function instalar(){
  if(deferredPrompt){deferredPrompt.prompt();}else{alert("No Android, clica nos 3 pontinhos do Chrome > Instalar App");}
}

// PWA
if('serviceWorker' in navigator){navigator.serviceWorker.register('./sw.js');}

carregarListaGitHub();
</script>
</body>
</html>
